<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Research Solver">
  <title>科研式解题器</title>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- 未闭合的环：别人没做好的那一块 -->
  <circle cx="32" cy="30" r="20" fill="none" stroke="#94a3b8" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="100 26" transform="rotate(112 32 30)"/>
  <!-- 内圈刻度：四阶段 -->
  <circle cx="32" cy="30" r="12" fill="none" stroke="#60a5fa" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="3 7" opacity="0.55"/>
  <!-- 补进缺口的那一块：创新点 -->
  <rect x="31.7" y="43.8" width="11" height="11" rx="3" fill="#34d399"
        transform="rotate(75 37.2 49.3)"/>
</svg>
